<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArTeck · Questionário</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#eef2f7;color:#1f4e78}
.box{text-align:center;padding:24px}
.spin{width:34px;height:34px;border:4px solid #d9e1ea;border-top-color:#2e75b6;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="ld"><div class="spin"></div>Carregando…</div>
<script>
const U="https://lfeodufywzgwklnmjagz.supabase.co";
const K="sb_publishable_4pRGZvATwKETPtm1lKX1GA_ibz00Pcc";
(async()=>{
  try{
    const p=new URLSearchParams(location.search);
    const q=(p.get("q")||"q_precos").replace(/[^a-z0-9_]/gi,"");
    let id=p.get("id")||localStorage.getItem("arteck_last_"+q)||(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(16).slice(2)));
    localStorage.setItem("arteck_last_"+q,id);
    p.set("id",id);
    history.replaceState(null,"","?"+p.toString());
    const r=await fetch(U+"/rest/v1/rpc/arteck_get_asset",{method:"POST",headers:{"Content-Type":"application/json","apikey":K,"Authorization":"Bearer "+K},body:JSON.stringify({p_nome:q})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const b64=await r.json();
    if(!b64) throw new Error("questionario nao encontrado");
    const gz=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("ld").innerHTML="Nao consegui carregar o questionario.<br>"+((e&&e.message)?e.message:e);
  }
})();
</script>
</body>
</html>
