version: '3.8'

services:
  receitanet-cookie-renewer:
    build: .
    container_name: receitanet-cookie-renewer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ===== NENHUM VALOR LITERAL NESTE ARQUIVO =====
      # Tudo vem do ambiente. Ver .env.example para a lista completa.

      # Credenciais do sistema alvo
      RECEITANET_USER: ${RECEITANET_USER}
      RECEITANET_PASS: ${RECEITANET_PASS}

      # n8n — host, chave e id da credencial sao especificos do ambiente
      N8N_API_URL: ${N8N_API_URL}
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_CREDENTIAL_ID: ${N8N_CREDENTIAL_ID}

      # Auth do endpoint /renew
      RENEW_AUTH_TOKEN: ${RENEW_AUTH_TOKEN}

      # Alertas — instancia de WhatsApp institucional
      WEBHOOK_ALERTA_URL: ${WEBHOOK_ALERTA_URL}
      UAZAPI_TOKEN_ALERTA: ${UAZAPI_TOKEN_ALERTA}
      ALERTA_WHATSAPP_DESTINO: ${ALERTA_WHATSAPP_DESTINO}

      # ===== TUNING =====
      HEADLESS: ${HEADLESS:-true}
      PORT: ${PORT:-8080}
